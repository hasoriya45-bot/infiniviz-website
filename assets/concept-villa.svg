<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Concept villa — elevation drawing (fallback for the 3D viewer)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#3a2f28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd8a3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb978" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="fins" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#8a5a3a"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="300" cy="330" r="70" fill="#f0b386" opacity=".18"/>
  <rect y="690" width="1600" height="210" fill="#141412"/>
  <g fill="none" stroke="#c9c1b3" stroke-width="2">
    <!-- plinth -->
    <rect x="220" y="672" width="1160" height="18" fill="#3a3632"/>
    <!-- lower volume -->
    <rect x="300" y="540" width="640" height="132" fill="#2a2622"/>
    <rect x="312" y="552" width="616" height="120" fill="url(#glow)" stroke="none"/>
    <path d="M389 552v120M466 552v120M543 552v120M620 552v120M697 552v120M774 552v120M851 552v120" stroke="#1b1a18" stroke-width="3"/>
    <rect x="292" y="526" width="672" height="14" fill="#d8d2c8" stroke="none"/>
    <!-- upper cantilever -->
    <rect x="460" y="404" width="720" height="122" fill="#26221f"/>
    <rect x="470" y="414" width="430" height="112" fill="url(#fins)" stroke="none"/>
    <rect x="905" y="414" width="270" height="112" fill="url(#glow)" stroke="none"/>
    <rect x="448" y="390" width="744" height="14" fill="#d8d2c8" stroke="none"/>
    <!-- pool -->
    <rect x="620" y="690" width="560" height="10" fill="#1d6c7d" stroke="none"/>
    <!-- landscape wall -->
    <rect x="232" y="580" width="16" height="92" fill="#57524b" stroke="none"/>
  </g>
  <g fill="#2f3a2a">
    <ellipse cx="170" cy="560" rx="70" ry="95"/><rect x="165" y="600" width="10" height="90" fill="#2a2018"/>
    <ellipse cx="1430" cy="540" rx="80" ry="110"/><rect x="1425" y="600" width="10" height="90" fill="#2a2018"/>
  </g>
  <text x="800" y="800" fill="#8f897d" font-family="Manrope, Arial, sans-serif" font-size="20" letter-spacing="5" text-anchor="middle">CONCEPT VILLA · SOUTH ELEVATION</text>
</svg>
